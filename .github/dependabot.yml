# Dependabot version updates for Compass Connect.
# Weekly runs, minor and patch updates grouped into one PR per ecosystem,
# and a 7-day cooldown on new releases. Security updates are not delayed by
# the cooldown and are not grouped, so each one gets its own PR and Jira ticket.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  # Frontends (yarn, handled by the npm ecosystem)
  - package-ecosystem: "npm"
    directories:
      - "/frontend-new"
      - "/admin-frontend"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # Backend (Poetry) and infrastructure (requirements.txt)
  - package-ecosystem: "pip"
    directories:
      - "/backend"
      - "/iac"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # Base images
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend-new"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]
