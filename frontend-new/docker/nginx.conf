server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Runtime configuration must never be cached
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /data/env.js { add_header Cache-Control "no-cache"; }
    location = /data/version.json { add_header Cache-Control "no-cache"; }

    # Hashed build assets can be cached for a long time
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single page application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
